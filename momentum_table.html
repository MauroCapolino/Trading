<script id="thm-js">(function(){var N="light",K="site_theme",d=document.documentElement;
function ap(t){d.classList.toggle("thm-inv",t!==N);d.setAttribute("data-theme",t)}
var t=null;try{var m=/thm=(dark|light)/.exec(location.hash);if(m)localStorage.setItem(K,m[1]);t=localStorage.getItem(K)}catch(e){}

<form id="f" hidden><b>Trading List</b>
<input id="p" type="password" autocomplete="current-password" placeholder="Password">
<label><input id="r" type="checkbox" checked> Remember on this device</label>
<button>Open</button><div id="e"></div></form><div id="w">Loading…</div>
<script>
const T=(k,d)=>window.ENC_T?window.ENC_T(k,d):d;
const S="2nEoj4w+q8w/FeVAe8WTcw==",N=600000,K="gamma-live-key",ENC="momentum_table.html.enc",U=null;
const u=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const b64=a=>btoa(String.fromCharCode(...a));
let DATA=null;
async function data(){
  if(!DATA){const r=await fetch(ENC+"?t="+Date.now(),{cache:"no-store"});
    if(!r.ok) throw new Error("fetch "+r.status); DATA=new Uint8Array(await r.arrayBuffer());}
  return DATA;
}
async function decrypt(raw){
  const b=await data();
  const k=await crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]);
  return crypto.subtle.decrypt({name:"AES-GCM",iv:b.slice(0,12)},k,b.slice(12));
}
function show(pt,raw){
  try{sessionStorage.setItem(K,b64(raw))}catch(_){}
  let h=new TextDecoder().decode(pt);
  if(document.getElementById("in"))h=h.split("href='index.html'").join("href='index.html?desk'").split('href="index.html"').join('href="index.html?desk"');   // ECOA: the start address is always the landing page; the eToro ECOA page itself = index.html?desk
  document.open();document.write(h);document.close();
}
async function derive(pw,salt){
  const b=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);
  return new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt:u(salt||S),iterations:N},b,256));
}
let UL=null;
async function unlock(){
  const pw=document.getElementById("p").value;
  if(!U) return derive(pw);
  const n=(document.getElementById("u").value||"").trim().toLowerCase();
  const h=b64(new Uint8Array(await crypto.subtle.digest("SHA-256",new TextEncoder().encode("ecoa-user:"+n))));
  const sl=U[h],kek=await derive(pw,sl?sl.s:S);
  if(!sl) throw new Error("user");
  UL=sl.l?[h,sl.l]:null;
  const w=u(sl.w),k=await crypto.subtle.importKey("raw",kek,"AES-GCM",false,["decrypt"]);
  return new Uint8Array(await crypto.subtle.decrypt({name:"AES-GCM",iv:w.slice(0,12)},k,w.slice(12)));
}
(async()=>{
  const s=localStorage.getItem(K)||sessionStorage.getItem(K);
  const IN=document.getElementById("in");
  // user 11/11/2026 ("I don't see the landing page with the world ... why?"): the START address always shows the landing page first, also when signed in
  // (user 11/11: "always show regardless if you visit again"; the eToro ECOA page itself = index.html?desk); the TAI logo (?home) shows it at any time. Signed in = 'Open' + 'Log out', no form.
  const Q="&"+location.search.slice(1)+"&",PN=location.pathname,START=PN.endsWith("/")||PN.endsWith("/index.html"),HOME=Q.indexOf("&home&")>=0,went=Q.indexOf("&desk&")>=0;
  if(IN)document.querySelectorAll('a[href="index.html"]').forEach(a=>a.setAttribute("href","index.html?desk"));
  if(s&&IN&&(HOME||(START&&!went))){
    document.getElementById("w").hidden=true;IN.hidden=false;
    const lo=document.getElementById("lo");if(lo)lo.onclick=ev=>{ev.preventDefault();try{localStorage.removeItem(K);sessionStorage.removeItem(K)}catch(_){}location.replace("index.html")};
    if(window.ENC_READY)window.ENC_READY();return}
  if(s){try{const raw=u(s);show(await decrypt(raw),raw);return}catch(e){
    if(String(e).indexOf("fetch")>=0){document.getElementById("w").textContent=T("load","Could not load the page ("+e.message+"). Refresh to retry.");return}
    localStorage.removeItem(K);sessionStorage.removeItem(K)}}
  document.getElementById("w").hidden=true;document.getElementById("f").hidden=false;(document.getElementById("u")||document.getElementById("p")).focus();
  if(window.ENC_READY)window.ENC_READY();
})();
document.getElementById("f").onsubmit=async ev=>{ev.preventDefault();
  const e=document.getElementById("e");e.textContent=T("checking","Checking…");
  const keep=document.getElementById("r").checked;
  let raw,pt;
  try{raw=await unlock();pt=await decrypt(raw)}
  catch(err){e.textContent=String(err).indexOf("fetch")>=0?T("retry","Could not load the page, try again"):T("wrong",U?"Wrong user name or password":"Wrong password");return}
  if(keep){try{localStorage.setItem(K,b64(raw))}catch(_){}}
  if(UL){try{if(localStorage.getItem("ecoa_lang_user")!==UL[0]){localStorage.setItem("ecoa_lang",UL[1]);localStorage.setItem("ecoa_lang_user",UL[0])}}catch(_){}}   // the user's default language, once per user and browser
  show(pt,raw)};
